name: Artifact Upload and Download Demo

on:
  workflow_dispatch:

jobs:
  # ========================================================
  # Job 1: Build & Upload Artifact to GitHub Storage
  # ========================================================
  build-and-upload:
    name: Build Application
    runs-on: [self-hosted, ubuntuvm]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Generate Build Artifacts
        run: |
          mkdir -p output
          echo "Build completed on: $(date)" > output/build-info.txt
          echo "Commit SHA: ${{ github.sha }}" >> output/build-info.txt
          echo "Generated by runner: ${{ runner.name }}" >> output/build-info.txt

      - name: Upload Artifact to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: app-release-package   # Artifact name displayed in the GitHub UI
          path: output/               # Directory or file path to upload
          retention-days: 7           # Days to keep the artifact before automatic deletion

  # ========================================================
  # Job 2: Download Artifact & Deploy
  # ========================================================
  download-and-deploy:
    name: Deploy Application
    needs: [build-and-upload]         # Ensures Job 2 waits for Job 1 to finish
    runs-on: [self-hosted, ubuntuvm]

    steps:
      - name: Download Artifact from GitHub
        uses: actions/download-artifact@v4
        with:
          name: app-release-package   # Must match the uploaded artifact name
          path: ./downloaded-output/  # Destination directory on the runner

      - name: Verify Downloaded Artifact Files
        run: |
          echo "Listing downloaded files:"
          ls -la ./downloaded-output/
          echo "--- File Contents ---"
          cat ./downloaded-output/build-info.txt